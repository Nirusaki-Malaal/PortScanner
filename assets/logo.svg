<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="100%" height="100%">
  <defs>
    <linearGradient id="scancyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="600" height="120" fill="#090d16" rx="10"/>
  <!-- Network socket crosshair glyph -->
  <g transform="translate(30, 25)">
    <rect x="0" y="0" width="70" height="70" fill="none" stroke="url(#scancyan)" stroke-width="2" rx="8"/>
    <!-- Concentric radar ring and crosshairs -->
    <circle cx="35" cy="35" r="20" fill="none" stroke="#00f5ff" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="35" cy="35" r="8" fill="none" stroke="#34d399" stroke-width="2"/>
    <line x1="35" y1="10" x2="35" y2="60" stroke="#00f5ff" stroke-width="1.5"/>
    <line x1="10" y1="35" x2="60" y2="35" stroke="#00f5ff" stroke-width="1.5"/>
    <circle cx="45" cy="25" r="2.5" fill="#00f5ff"/>
  </g>
  <!-- Typography -->
  <text x="125" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#f8fafc" letter-spacing="1">PORTSCANNER</text>
  <text x="127" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="13" font-weight="400" fill="#94a3b8" letter-spacing="0.5">PARALLEL NON-BLOCKING POSIX TCP RECONNAISSANCE TOOL</text>
  <line x1="125" y1="92" x2="570" y2="92" stroke="#1e293b" stroke-width="1.5"/>
</svg>
